services:
  postgres:
    image: postgres:15
    container_name: bi_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../03_dw/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bi_jupyter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      ETL_TARGET: sqlite
    ports:
      - "8888:8888"
    volumes:
      - ../:/home/jovyan/work

  etl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.etl
    container_name: bi_etl
    env_file:
      - ../.env
    environment:
      ETL_TARGET: postgres
      LOAD_POSTGRES: "1"
      REQUIRE_POSTGRES_LOAD: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  superset:
    build:
      context: ..
      dockerfile: docker/superset/Dockerfile
    container_name: bi_superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    env_file:
      - ../.env
    ports:
      - "${SUPERSET_PORT:-8088}:${SUPERSET_PORT:-8088}"
    volumes:
      - superset_home:/app/superset_home

volumes:
  pg_data:
  superset_home:
