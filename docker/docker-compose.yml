version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: bi_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../03_dw/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bi_jupyter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8888:8888"
    volumes:
      - ../:/home/jovyan/work
    command: start-notebook.sh --NotebookApp.token=${JUPYTER_TOKEN} --NotebookApp.password=''

  superset:
    image: apache/superset:3.1.1
    container_name: bi_superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command: >
      /bin/bash -c "
      superset db upgrade &&
      superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Admin --lastname BI --email ${SUPERSET_ADMIN_EMAIL:-admin@poc.com} --password ${SUPERSET_ADMIN_PASS:-admin} || true &&
      superset init &&
      /usr/bin/run-server.sh
      "

volumes:
  pg_data:
  superset_home:
